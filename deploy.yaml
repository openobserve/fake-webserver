apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-webserver
  namespace: fake-webserver
  labels:
    app: fake-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-webserver
  template:
    metadata:
      labels:
        app: fake-webserver
    spec:
      containers:
        - name: fake-webserver
          image: coldstar/fake-webserver:v2
          ports:
            - containerPort: 8080
          resources:
            # requests:
              # cpu: "1"
              # memory: "16Mi"
            # limits:
              # cpu: "1"
              # memory: "16Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fake-webserver
  namespace: fake-webserver
spec:
  selector:
    app: fake-webserver
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
